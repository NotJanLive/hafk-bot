kind: pipeline
type: docker
name: build

trigger:
  branch:
    - main
  event:
    - push
    - pull_request

steps:
  - name: test
    image: eclipse-temurin:25-jdk
    commands:
      - chmod +x mvnw
      - ./mvnw -B -ntp test

  - name: publish
    image: plugins/docker
    settings:
      registry: ghcr.io
      repo: ghcr.io/notjanlive/hafk-bot
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}
    when:
      event:
        - push
